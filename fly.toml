# Fly.io app config — production deploy uses Docker (see Dockerfile), not mise.
# SQLite DB files and Active Storage live under /rails/storage (persistent volume below).
app = "safelog-ai"
primary_region = "fra"
console_command = "/rails/bin/rails console"

[mounts]
  source = "data"
  destination = "/rails/storage"

[build]

[env]
  PORT = "8080"
  RAILS_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/up"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
