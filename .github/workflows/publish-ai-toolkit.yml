name: Publish AI Toolkit

on:
  push:
    branches: [main, master]
    paths:
      - packages/ai-toolkit/**
      - .github/workflows/publish-ai-toolkit.yml
  pull_request:
    branches: [main, master]
    paths:
      - packages/ai-toolkit/**
      - .github/workflows/publish-ai-toolkit.yml

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            package:
              - 'packages/ai-toolkit/**'

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ai-toolkit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@szymoniwacz"
          cache: npm
          cache-dependency-path: packages/ai-toolkit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const required = ['name', 'version', 'publishConfig'];
            for (const key of required) {
              if (!pkg[key]) throw new Error('missing package.json field: ' + key);
            }
            if (pkg.publishConfig.registry !== 'https://npm.pkg.github.com') {
              throw new Error('unexpected publishConfig.registry');
            }
            if (pkg.name !== '@szymoniwacz/ai-toolkit') {
              throw new Error('unexpected package name');
            }
          "

      - name: Validate skill frontmatter
        run: |
          node -e "
            const fs = require('fs');
            const skillPath = 'skills/code-review/SKILL.md';
            if (!fs.existsSync(skillPath)) throw new Error('missing skill file');
            const content = fs.readFileSync(skillPath, 'utf8');
            const match = content.match(/^---\n([\s\S]*?)\n---/);
            if (!match) throw new Error('missing YAML frontmatter');
            const frontmatter = match[1];
            if (!/^name:\s*code-review/m.test(frontmatter)) {
              throw new Error('frontmatter name must be code-review');
            }
            if (!/^description:\s*.+/m.test(frontmatter)) {
              throw new Error('frontmatter description required');
            }
          "

      - name: Validate publishable files
        run: npm pack --dry-run

      - name: Smoke test install and uninstall
        run: node scripts/smoke-install.js

  publish:
    needs: [validate, changes]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ai-toolkit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@szymoniwacz"
          cache: npm
          cache-dependency-path: packages/ai-toolkit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
