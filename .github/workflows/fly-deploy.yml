name: Fly Auto Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    concurrency: fly-deploy-main

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: latest

      - name: Verify Fly auth
        run: |
          flyctl auth whoami
          flyctl status --app safelog-ai

      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.toml --app safelog-ai --local-only

      - name: Smoke check — verify /up endpoint
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent https://safelog-ai.fly.dev/up > /dev/null 2>&1; then
              echo "✓ Health check passed"
              exit 0
            fi

            echo "Attempt $attempt/10 failed, retrying..."
            sleep 5
          done

          echo "✗ Health check failed after 10 attempts"
          exit 1
