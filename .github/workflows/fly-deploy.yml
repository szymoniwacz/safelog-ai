name: Fly Auto Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      FLYCTL_ACCESS_TOKEN: ${{ secrets.FLYCTL_ACCESS_TOKEN || secrets.FLY_API_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.FLYCTL_ACCESS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: latest

      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.toml --app safelog-ai --remote-only --access-token "$FLYCTL_ACCESS_TOKEN"

      - name: Smoke check — verify /healthz endpoint
        run: |
          for attempt in {1..5}; do
            if curl --fail --silent https://safelog-ai.fly.dev/healthz > /dev/null 2>&1; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Attempt $attempt/5 failed, retrying..."
            sleep 2
          done
          echo "✗ Health check failed after 5 attempts"
          exit 1
